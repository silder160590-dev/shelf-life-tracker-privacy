<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - Shelf Life</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        .lang-switcher { margin: 20px 0; }
        select.lang-select { padding: 12px 20px; border-radius: 10px; border: 2px solid #007AFF; background: white; font-size: 16px; color: #333; cursor: pointer; width: 100%; max-width: 400px; }
        select.lang-select:focus { outline: none; border-color: #0055cc; box-shadow: 0 0 0 3px rgba(0,122,255,0.2); }
        .privacy-content { margin-top: 20px; }
    </style>
</head>
<body>
<h1>🔒 Privacy Policy - Shelf Life</h1>

<div class="lang-switcher">
    <select class="lang-select" onchange="if(this.value) location.href=this.value">
        <option value="">🌐 Выберите язык / Select language</option>
        <option value="privacy_ru.html">🇷🇺 Русский</option>
        <option value="privacy_en.html">🇬🇧 English</option>
        <option value="privacy_zh.html">🇨🇳 中文</option>
        <option value="privacy_es.html">🇪🇸 Español</option>
        <option value="privacy_fr.html">🇫🇷 Français</option>
        <option value="privacy_de.html">🇩🇪 Deutsch</option>
        <option value="privacy_hi.html">🇮🇳 हिन्दी</option>
    </select>
</div>

<div class="privacy-content">
    <p>Please select your language above.</p>
    <p>Пожалуйста, выберите ваш язык выше.</p>
    <p>请在上面选择您的语言。</p>
</div>
</body>
</html>
